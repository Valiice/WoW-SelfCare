name: Bump interface versions

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT so the pushed tag triggers release.yml (GITHUB_TOKEN would not).
          token: ${{ secrets.RELEASE_PAT }}
          # Full history + tags: the base version is derived from the latest tag.
          fetch-depth: 0

      - name: Set up Lua
        uses: hishamhm/gh-actions-lua@master
        with:
          luaVersion: "5.1"

      - name: Fetch live build versions
        run: |
          # --fail: non-zero exit on HTTP error -> job fails (ship nothing).
          curl --fail --silent --show-error --location \
            "https://wago.tools/api/builds" -o builds.json
          # Latest (first) version per product -> "<product> <version>" lines.
          jq -r 'to_entries[] | "\(.key) \(.value[0].version)"' builds.json > live.txt
          echo "--- live.txt ---"
          cat live.txt

      - name: Compute bumps
        id: bump
        run: |
          # Base version = highest existing v* tag (the real release history is
          # in tags, not the TOC ## Version: line). Fall back to 0.0.0 if none.
          BASE=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          BASE=${BASE:-0.0.0}
          echo "Base version (latest tag): $BASE"
          NEW_VERSION=$(lua scripts/bump_interface_cli.lua live.txt "$BASE" SelfCare*.toc)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Result: $NEW_VERSION"

      - name: Commit, tag and push
        if: steps.bump.outputs.version != 'NO_CHANGE'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SelfCare*.toc
          git commit -m "chore: bump interface versions (v$NEW_VERSION)"
          git tag "v$NEW_VERSION"
          # Push commit and tag explicitly — `--follow-tags` skips lightweight tags,
          # which would leave the tag unpushed and release.yml never triggered.
          git push origin HEAD
          git push origin "v$NEW_VERSION"
