name: Set version and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, e.g. 1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT so the pushed tag triggers release.yml (GITHUB_TOKEN would not).
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Lua
        uses: hishamhm/gh-actions-lua@master
        with:
          luaVersion: "5.1"

      - name: Set version across TOCs
        run: |
          # set_version_cli validates X.Y.Z and exits non-zero on bad input,
          # which fails the job (nothing committed) — fail loud on a typo.
          VERSION=$(lua scripts/set_version_cli.lua "${{ inputs.version }}" SelfCare*.toc)
          echo "Set version to $VERSION"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SelfCare*.toc
          git commit -m "chore: set version v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --follow-tags
