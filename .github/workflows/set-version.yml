name: Set version and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, e.g. 1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT so the pushed tag triggers release.yml (GITHUB_TOKEN would not).
          token: ${{ secrets.RELEASE_PAT }}
          # Full history + tags so tag-collision is detected before pushing.
          fetch-depth: 0

      - name: Set up Lua
        uses: hishamhm/gh-actions-lua@master
        with:
          luaVersion: "5.1"

      - name: Set version across TOCs
        # Pass the input via env (not inline ${{ }}) so it can't break out of
        # the shell — the value reaches bash as a quoted variable, not source.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # set_version_cli validates X.Y.Z and exits non-zero on bad input,
          # which fails the job (nothing committed) — fail loud on a typo.
          VERSION=$(lua scripts/set_version_cli.lua "$INPUT_VERSION" SelfCare*.toc)
          echo "Set version to $VERSION"

      - name: Commit, tag and push
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SelfCare*.toc
          git commit -m "chore: set version v$INPUT_VERSION"
          git tag "v$INPUT_VERSION"
          # Push commit and tag explicitly — `--follow-tags` skips lightweight tags,
          # which would leave the tag unpushed and release.yml never triggered.
          git push origin HEAD
          git push origin "v$INPUT_VERSION"
